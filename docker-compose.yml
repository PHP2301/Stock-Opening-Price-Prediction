version: '3.8'

services:
  trainer:
    build: .
    container_name: stock-trainer
    environment:
      - TICKER=${TICKER:-} # Đặt "META", "GOOGL", "VNM.VN" để train riêng, hoặc để trống để train hết
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./config:/app/config
      - ./logs:/app/logs
    command: >
      sh -c "
      python scripts/run_training_transformer.py $$TICKER &&
      python scripts/run_walk_forward_backtest.py $$TICKER &&
      python scripts/predict.py $${TICKER:-ALL}
      "

